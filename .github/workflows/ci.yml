name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stream_quest_test
          POSTGRES_USER: stream_quest
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://stream_quest:test_password@localhost:5432/stream_quest_test
      DATABASE_NAME: stream_quest_test
      DATABASE_USER: stream_quest
      DATABASE_PASSWORD: test_password
      DATABASE_HOST: localhost
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      FRONTEND_URL: http://localhost:3000
      OVERLAY_BASE_URL: http://localhost:3000/overlay
      TWITCH_CALLBACK_URL: http://localhost:3999/auth/twitch/callback
      TWITCH_WEBHOOK_CALLBACK_URL: http://localhost:3999/twitch/webhook
      # Secrets
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      TWITCH_WEBHOOK_SECRET: ${{ secrets.TWITCH_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:cov

      - name: Check coverage threshold
        run: |
          COVERAGE=$(node -e "
            const data = require('./coverage/coverage-summary.json');
            console.log(Math.round(data.total.statements.pct));
          ")
          echo "Coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt 85 ]; then
            echo "❌ Coverage $COVERAGE% is below threshold of 85%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets threshold"

      - name: Generate swagger.json
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run swagger:generate

      - name: Push swagger.json to stream-quest-docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: dmnemec/copy_file_to_another_repo_action@main
        with:
          source_file: swagger.json
          destination_repo: WeaveCast/stream-quest-docs
          destination_folder: static
          destination_branch: main
          user_email: github-actions@github.com
          user_name: github-actions[bot]
          commit_message: 'chore: update swagger.json from stream-quest-back'
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_GITHUB_TOKEN }}
